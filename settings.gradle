pluginManagement {
	repositories {
		maven {
			name = "Fabric"
			url = "https://maven.fabricmc.net/"
		}
		gradlePluginPortal()
		mavenCentral()
	}
}

buildscript {
	repositories {
		maven {
			name = "Fabric"
			url = "https://maven.fabricmc.net/"
		}
		gradlePluginPortal()
		mavenCentral()
	}
	dependencies {
		def foojayResolverJar = fileTree(new File(gradle.gradleUserHomeDir, "caches/modules-2/files-2.1/org.gradle.toolchains/foojay-resolver/0.8.0")) {
			include "**/foojay-resolver-0.8.0.jar"
		}.files.find()
		if (foojayResolverJar != null) {
			classpath files(foojayResolverJar)
		} else {
			classpath "org.gradle.toolchains:foojay-resolver:0.8.0"
		}
	}
}

apply plugin: 'org.gradle.toolchains.foojay-resolver-convention'
