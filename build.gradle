plugins {
	id 'net.fabricmc.fabric-loom' version '1.15.5'
	id 'maven-publish'
	id 'eclipse'
	id 'idea'
	id 'java-library'
}

version = project.mod_version
group = project.group_name

base {
	archivesName = "${project.mod_id}-${project.minecraft_version}-fabric"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << "-Xlint:all,-processing,-deprecation,-this-escape" << "-Werror"
	options.encoding = 'UTF-8'
	options.release.set(25)
}

loom {
	accessWidenerPath = file("src/main/resources/${project.mod_id}.accesswidener")
	splitEnvironmentSourceSets()

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			client()
			setConfigName("Client")
			ideConfigGenerated(true)
			runDir("run")
		}

		server {
			server()
			setConfigName("Server")
			ideConfigGenerated(true)
			runDir("run")
		}
	}
}

fabricApi {
	configureDataGeneration {
		outputDirectory = file("src/generated/fabric")
		createSourceSet = true
		modId = "${project.mod_id}-datagen"
		client = true
	}
}

sourceSets {
	main {
		resources {
			srcDir 'src/generated/resources'
		}
	}

	client {
		resources {
			srcDir 'src/client/resources'
		}
	}

	apiTestMod {
		java.srcDir 'src/apiTestMod/java'
		resources.srcDir 'src/apiTestMod/resources'
	}
}

repositories {
	maven { // Local fallback for artifacts Windows Gradle cannot fetch over TLS
		url = layout.projectDirectory.dir("gradle/local-maven")
	}
	maven { url = "https://maven.fabricmc.net/" }
	maven { // Maven Central mirror for Windows Java TLS compatibility
		url = "https://maven.aliyun.com/repository/public/"
	}
	maven { // Beanification
		url = "https://maven.tamaized.com/releases/"
	}
	maven { // JEI
		name = "ModMaven"
		url = "https://modmaven.dev/"
	}
	maven { // JEI upstream
		name = "Jared's Maven"
		url = "https://maven.blamejared.com/"
	}
	maven { // Jade
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation(include("org.tomlj:tomlj:${project.tomlj_version}"))
	implementation(include("org.antlr:antlr4-runtime:${project.antlr_version}"))

	// Optional runtime/compile-time integrations.
	compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
	compileOnly "maven.modrinth:jade:${project.jade_version}"
	compileOnly "javax.annotation:javax.annotation-api:1.3.2"
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"
	compileOnly "com.google.errorprone:error_prone_annotations:2.21.1"

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.3"
	testImplementation "org.mockito:mockito-junit-jupiter:5.12.0"
}

// This fixture deliberately compiles against the packaged API. Keeping main.output
// off this classpath makes missing production-JAR classes fail like they would for
// an independent mod rather than being hidden by Gradle's project output.
def apiConsumerProductionJar = tasks.named("jar", Jar)
def publicApiSourcesJar = tasks.named("sourcesJar", Jar)
def apiConsumerClasspath = files(apiConsumerProductionJar.flatMap { it.archiveFile })
apiConsumerClasspath.from(sourceSets.main.compileClasspath)
sourceSets.apiTestMod.compileClasspath = apiConsumerClasspath
sourceSets.apiTestMod.runtimeClasspath = sourceSets.apiTestMod.output + apiConsumerClasspath

tasks.named(sourceSets.apiTestMod.compileJavaTaskName, JavaCompile) {
	dependsOn apiConsumerProductionJar
	classpath = apiConsumerClasspath
}

processResources {
	inputs.property "version", project.version
	inputs.property "api_version", project.api_version
	exclude("**/.*")
	filesMatching("fabric.mod.json") {
		expand "version": project.version, "api_version": project.api_version
	}
}

jar {
	exclude("**/.*")
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

def packagedResourceRoots = [
	file("src/main/resources"),
	file("src/generated/resources"),
	file("src/generated/fabric"),
	file("src/client/resources")
]

tasks.register("verifyResourceUnion") {
	group = "verification"
	description = "Verifies that every resource root has unique paths and is completely packaged in the production JAR."
	dependsOn tasks.named("jar")
	inputs.files(packagedResourceRoots.collect { root ->
		fileTree(root) {
			exclude("**/.*", "**/.*/**")
		}
	})
	inputs.file(tasks.named("jar").flatMap { it.archiveFile })

	doLast {
		Map<String, File> resources = new TreeMap<>()
		Map<String, List<File>> duplicates = new TreeMap<>()
		packagedResourceRoots.findAll(File::exists).each { root ->
			fileTree(root) {
				exclude("**/.*", "**/.*/**")
			}.files.sort().each { resource ->
				String relativePath = root.toPath().relativize(resource.toPath())
					.iterator().collect { it.toString() }.join("/")
				File previous = resources.putIfAbsent(relativePath, resource)
				if (previous != null) {
					duplicates.computeIfAbsent(relativePath, ignored -> [previous]).add(resource)
				}
			}
		}

		if (!duplicates.isEmpty()) {
			String details = duplicates.entrySet().take(50).collect { entry ->
				"${entry.key}: ${entry.value.collect { project.relativePath(it) }.join(', ')}"
			}.join(System.lineSeparator())
			throw new GradleException("Duplicate resource paths would be resolved by copy order instead of an explicit migration decision:${System.lineSeparator()}${details}")
		}

		File archive = tasks.named("jar").get().archiveFile.get().asFile
		Set<String> archiveEntries = new HashSet<>()
		new java.util.zip.ZipFile(archive).withCloseable { zip ->
			Enumeration<? extends java.util.zip.ZipEntry> entries = zip.entries()
			while (entries.hasMoreElements()) {
				java.util.zip.ZipEntry entry = entries.nextElement()
				if (!entry.isDirectory()) {
					archiveEntries.add(entry.name)
				}
			}
		}

		List<String> missing = new ArrayList<>()
		resources.keySet().each { relativePath ->
			if (!archiveEntries.contains(relativePath)) {
				missing.add(relativePath)
			}
		}
		if (!missing.isEmpty()) {
			throw new GradleException("Production JAR is missing ${missing.size()} source resources:${System.lineSeparator()}${missing.take(100).join(System.lineSeparator())}")
		}

		logger.lifecycle("Verified ${resources.size()} unique resources from ${packagedResourceRoots.count(File::exists)} roots in ${archive.name}")
	}
}

def publicApiBaselineFile = file("src/test/resources/twilightforest/api/public-api-v1.txt")
def isPublicApiReference = { String reference ->
	reference == "twilightforest.api" || reference.startsWith("twilightforest.api.")
}
def isForbiddenConsumerReference = { String reference ->
	boolean twilightForestImplementation = (reference == "twilightforest" || reference.startsWith("twilightforest."))
		&& !isPublicApiReference(reference)
	boolean minecraftClient = reference == "net.minecraft.client" || reference.startsWith("net.minecraft.client.")
	twilightForestImplementation || minecraftClient
}

tasks.register("verifyPublicApi") {
	group = "verification"
	description = "Compiles an independent API consumer and verifies the v1 API in binary and source JARs."
	dependsOn apiConsumerProductionJar
	dependsOn publicApiSourcesJar
	dependsOn tasks.named(sourceSets.apiTestMod.compileJavaTaskName)
	inputs.file(publicApiBaselineFile)
	inputs.file(apiConsumerProductionJar.flatMap { it.archiveFile })
	inputs.file(publicApiSourcesJar.flatMap { it.archiveFile })
	inputs.files(fileTree("src/apiTestMod/java") { include "**/*.java" })

	doLast {
		List<String> baseline = publicApiBaselineFile.readLines("UTF-8")
			.collect(String::trim)
			.findAll { line -> !line.isEmpty() && !line.startsWith("#") }
		List<String> malformed = baseline.findAll { line ->
			!(line ==~ /(?:TYPE|FIELD|METHOD|CONSTRUCTOR|ENUM)\s+.+/)
		}
		if (!malformed.isEmpty()) {
			throw new GradleException("Malformed public API baseline entries: ${malformed.join(', ')}")
		}

		Set<String> baselineTypes = baseline
			.findAll { line -> line.startsWith("TYPE ") }
			.collect { line -> line.substring("TYPE ".length()) }
			.toSet()
		if (baselineTypes.isEmpty()) {
			throw new GradleException("The public API baseline contains no TYPE entries")
		}

		File binaryArchive = apiConsumerProductionJar.get().archiveFile.get().asFile
		File sourceArchive = publicApiSourcesJar.get().archiveFile.get().asFile
		Set<String> binaryEntries = new HashSet<>()
		List<String> clientBinaryReferences = new ArrayList<>()
		new java.util.zip.ZipFile(binaryArchive).withCloseable { zip ->
			Enumeration<? extends java.util.zip.ZipEntry> entries = zip.entries()
			while (entries.hasMoreElements()) {
				java.util.zip.ZipEntry entry = entries.nextElement()
				if (entry.isDirectory()) {
					continue
				}
				binaryEntries.add(entry.name)
				if (entry.name.startsWith("twilightforest/api/") && entry.name.endsWith(".class")) {
					String constants = zip.getInputStream(entry).withCloseable { stream ->
						new String(stream.readAllBytes(), java.nio.charset.StandardCharsets.ISO_8859_1)
					}
					if (constants.contains("net/minecraft/client/") || constants.contains("twilightforest/client/")) {
						clientBinaryReferences.add(entry.name)
					}
				}
			}
		}

		List<String> missingBinaryTypes = baselineTypes.collect { type ->
			type.replace('.', '/') + ".class"
		}.findAll { entry -> !binaryEntries.contains(entry) }
		if (!missingBinaryTypes.isEmpty()) {
			throw new GradleException("Production JAR is missing public API classes: ${missingBinaryTypes.join(', ')}")
		}
		if (!clientBinaryReferences.isEmpty()) {
			throw new GradleException("Common public API classes reference client-only code: ${clientBinaryReferences.join(', ')}")
		}

		Set<String> requiredSources = baselineTypes.collect { type ->
			String topLevelType = type.contains('$') ? type.substring(0, type.indexOf('$')) : type
			topLevelType.replace('.', '/') + ".java"
		}.toSet()
		Set<String> sourceEntries = new HashSet<>()
		List<String> clientSourceReferences = new ArrayList<>()
		new java.util.zip.ZipFile(sourceArchive).withCloseable { zip ->
			Enumeration<? extends java.util.zip.ZipEntry> entries = zip.entries()
			while (entries.hasMoreElements()) {
				java.util.zip.ZipEntry entry = entries.nextElement()
				if (entry.isDirectory()) {
					continue
				}
				sourceEntries.add(entry.name)
				if (entry.name.startsWith("twilightforest/api/") && entry.name.endsWith(".java")) {
					String source = zip.getInputStream(entry).withCloseable { stream ->
						new String(stream.readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
					}
					if (source.contains("net.minecraft.client") || source.contains("twilightforest.client")) {
						clientSourceReferences.add(entry.name)
					}
				}
			}
		}

		List<String> missingSources = requiredSources.findAll { entry -> !sourceEntries.contains(entry) }.sort()
		if (!missingSources.isEmpty()) {
			throw new GradleException("Sources JAR is missing public API sources: ${missingSources.join(', ')}")
		}
		if (!clientSourceReferences.isEmpty()) {
			throw new GradleException("Common public API sources reference client-only code: ${clientSourceReferences.join(', ')}")
		}

		Map<String, Boolean> consumerBoundaryExamples = [
			"twilightforest.api.AccessoryApi": false,
			"twilightforest.TwilightForestMod": true,
			"twilightforest.client.TwilightForestClient": true,
			"net.minecraft.client.Minecraft": true
		]
		consumerBoundaryExamples.each { reference, forbidden ->
			if (isForbiddenConsumerReference(reference) != forbidden) {
				throw new GradleException("Public API consumer-boundary matcher regression for ${reference}")
			}
		}

		Set<String> forbiddenConsumerReferences = new TreeSet<>()
		int publicApiImports = 0
		fileTree("src/apiTestMod/java") { include "**/*.java" }.files.sort().each { sourceFile ->
			// Parse Java syntax so comments and string literals cannot create false
			// positives, while fully-qualified implementation uses remain visible.
			def compiler = javax.tools.ToolProvider.systemJavaCompiler
			if (compiler == null) {
				throw new GradleException("A full JDK is required to verify the public API consumer boundary")
			}
			compiler.getStandardFileManager(null, Locale.ROOT, java.nio.charset.StandardCharsets.UTF_8).withCloseable { fileManager ->
				def compilationUnits = fileManager.getJavaFileObjects(sourceFile)
				def parser = (com.sun.source.util.JavacTask) compiler.getTask(
					null,
					fileManager,
					null,
					["-proc:none"],
					null,
					compilationUnits
				)
				parser.parse().each { compilationUnit ->
					String packageName = compilationUnit.packageName?.toString()
					if (packageName == "twilightforest" || packageName?.startsWith("twilightforest.")) {
						forbiddenConsumerReferences.add("${project.relativePath(sourceFile)}: package ${packageName}")
					}
					compilationUnit.imports.each { importTree ->
						String imported = importTree.qualifiedIdentifier.toString()
						if (isPublicApiReference(imported)) {
							publicApiImports++
						}
					}
					new com.sun.source.util.TreeScanner<Void, Void>() {
						@Override
						Void visitMemberSelect(com.sun.source.tree.MemberSelectTree node, Void unused) {
							String reference = node.toString()
							if (isForbiddenConsumerReference(reference)) {
								forbiddenConsumerReferences.add("${project.relativePath(sourceFile)}: ${reference}")
							}
							return super.visitMemberSelect(node, unused)
						}
					}.scan(compilationUnit, null)
				}
			}
		}
		if (publicApiImports == 0) {
			throw new GradleException("The independent consumer fixture does not import the Twilight Forest public API")
		}
		if (!forbiddenConsumerReferences.isEmpty()) {
			throw new GradleException("The independent consumer references client-only or Twilight Forest implementation code:${System.lineSeparator()}${forbiddenConsumerReferences.join(System.lineSeparator())}")
		}

		Set<String> consumerClasspath = sourceSets.apiTestMod.compileClasspath.files.collect { it.canonicalPath }.toSet()
		String expectedJar = binaryArchive.canonicalPath
		if (!consumerClasspath.contains(expectedJar)) {
			throw new GradleException("The independent consumer classpath does not contain the production JAR: ${expectedJar}")
		}
		Set<String> leakedMainOutput = sourceSets.main.output.files
			.collect { it.canonicalPath }
			.findAll(consumerClasspath::contains)
			.toSet()
		if (!leakedMainOutput.isEmpty()) {
			throw new GradleException("The independent consumer classpath leaks main output directories: ${leakedMainOutput.join(', ')}")
		}

		logger.lifecycle("Verified ${baselineTypes.size()} public API types in ${binaryArchive.name} and ${sourceArchive.name}; independent consumer compiled without main output")
	}
}

tasks.named("check") {
	dependsOn tasks.named("verifyResourceUnion")
	dependsOn tasks.named("verifyPublicApi")
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
		maven {
			name = "teamTwilightReleases"
			url = uri("https://maven.tamaized.com/releases")
			credentials {
				username = providers.environmentVariable("MAVEN_USER").orNull
				password = providers.environmentVariable("MAVEN_PASS").orNull
			}
		}
	}
}

test {
	useJUnitPlatform()
	systemProperty "junit.jupiter.extensions.autodetection.enabled", "true"
}
