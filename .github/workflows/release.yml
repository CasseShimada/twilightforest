name: Release Fabric build

on:
  push:
    tags:
      - "fabric-1.21.11-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish player release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          minecraft_version="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          mod_id="$(sed -n 's/^mod_id=//p' gradle.properties)"
          expected_tag="fabric-${minecraft_version}-${mod_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Expected tag ${expected_tag}, received ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [[ "${mod_version}" == *-* ]]; then
            echo "A formal release cannot use a prerelease version: ${mod_version}" >&2
            exit 1
          fi
          {
            echo "minecraft_version=${minecraft_version}"
            echo "mod_version=${mod_version}"
            echo "tag=${expected_tag}"
            echo "binary=${mod_id}-${minecraft_version}-fabric-${mod_version}.jar"
          } >> "${GITHUB_OUTPUT}"

      - name: Build release
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build --warning-mode all --console=plain

      - name: Prepare player download
        env:
          BINARY: ${{ steps.release.outputs.binary }}
          MOD_VERSION: ${{ steps.release.outputs.mod_version }}
        shell: bash
        run: |
          set -euo pipefail
          source_jar="build/libs/${BINARY}"
          test -f "${source_jar}"
          packaged_version="$(unzip -p "${source_jar}" fabric.mod.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          if [[ "${packaged_version}" != "${MOD_VERSION}" ]]; then
            echo "Packaged version ${packaged_version} does not match ${MOD_VERSION}" >&2
            exit 1
          fi
          mkdir -p build/release
          cp "${source_jar}" build/release/
          awk '
            /^## \[/ { if (seen++) exit }
            seen { print }
          ' CHANGELOG.md > build/release/RELEASE_NOTES.md
          test -s build/release/RELEASE_NOTES.md

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.tag }}
          if-no-files-found: error
          path: build/release/${{ steps.release.outputs.binary }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          MINECRAFT_VERSION: ${{ steps.release.outputs.minecraft_version }}
          MOD_VERSION: ${{ steps.release.outputs.mod_version }}
          BINARY: ${{ steps.release.outputs.binary }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --verify-tag \
            --latest=false \
            --title "暮色森林 Fabric ${MOD_VERSION}（Minecraft ${MINECRAFT_VERSION}）" \
            --notes-file build/release/RELEASE_NOTES.md \
            "build/release/${BINARY}"
